<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }} · ASO</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{ page.title | default: site.title }} · ASO">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="ASO">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ page.title | default: site.title }} · ASO">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <div id="progress-bar" class="progress-bar"></div>

  <div class="doc-layout">
    <aside class="doc-sidebar">
      <div class="doc-sidebar-inner">
        <a class="home-link" href="{{ '/' | relative_url }}">← ASO</a>
        <div class="doc-toc-label">En aquesta pàgina</div>
        <nav id="doc-toc" class="doc-toc"></nav>
      </div>
    </aside>

    <main class="doc-main">
      <article class="content">
        {% if page.last_updated %}
        <div class="last-updated">Última actualització: {{ page.last_updated | date: "%d/%m/%Y" }}</div>
        {% endif %}
        {{ content }}
      </article>
      <footer>
        <span>Iker Espinosa López · ASO</span>
        <a href="https://github.com/ikerespinosalopez/ASO">↳ veure el codi al repositori</a>
      </footer>
    </main>
  </div>

  <a id="to-top" class="to-top" href="#index" title="Torna a l'índex" aria-label="Torna a l'índex">↑</a>

  <script>
  (function(){
    var headings = document.querySelectorAll('.content h2, .content h3');
    var toc = document.getElementById('doc-toc');
    var items = [];
    headings.forEach(function(h){
      if(!h.id) return;
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.className = h.tagName === 'H3' ? 'level-3' : 'level-2';
      toc.appendChild(a);
      items.push({el:h, link:a});
    });

    var btn = document.getElementById('to-top');
    var progressBar = document.getElementById('progress-bar');

    function onScroll(){
      var pos = window.scrollY + 120;
      var current = null;
      items.forEach(function(item){
        if(item.el.offsetTop <= pos) current = item;
      });
      items.forEach(function(item){
        item.link.classList.toggle('active', item === current);
      });
      if(btn) btn.classList.toggle('visible', window.scrollY > 300);

      if(progressBar){
        var docHeight = document.documentElement.scrollHeight - window.innerHeight;
        var pct = docHeight > 0 ? Math.min(100, (window.scrollY / docHeight) * 100) : 0;
        progressBar.style.width = pct + '%';
      }
    }
    window.addEventListener('scroll', onScroll, {passive:true});
    window.addEventListener('resize', onScroll);
    onScroll();

    document.querySelectorAll('.content pre').forEach(function(pre){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'copy-btn';
      btn.textContent = 'copiar';
      btn.addEventListener('click', function(){
        var code = pre.querySelector('code');
        var text = code ? code.innerText : pre.innerText;

        function showResult(ok){
          btn.textContent = ok ? 'copiat!' : 'error';
          btn.classList.toggle('copied', ok);
          setTimeout(function(){
            btn.textContent = 'copiar';
            btn.classList.remove('copied');
          }, 1500);
        }

        function fallbackCopy(){
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          var ok = false;
          try { ok = document.execCommand('copy'); } catch(e) { ok = false; }
          document.body.removeChild(ta);
          showResult(ok);
        }

        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).then(function(){
            showResult(true);
          }).catch(fallbackCopy);
        } else {
          fallbackCopy();
        }
      });
      pre.appendChild(btn);
    });
  })();
  </script>
</body>
</html>
